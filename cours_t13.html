<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Séance T13 GTB</title>

<style>
/* Mobile d'abord : une colonne, une question par écran, barre de progression collante. Charte GRETA GIP FIPAN. */
:root{
  --bg:#f3f8f8; --surface:#ffffff; --fg:#1e2426; --muted:#5e6b70; --line:#cfe6e6;
  --profond:#0b5560; --emeraude:#0e8a6c; --turq:#00a3ab; --tint:#e6f6f5;
  --ok:#1f8a4c; --ok-bg:#e7f5ec; --ko:#b8432f; --ko-bg:#fbeae6; --warn-bg:#fff4e0;
  --on-accent:#ffffff; --img-bg:#ffffff;
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1a1c; --surface:#132629; --fg:#e4eef0; --muted:#9db0b4; --line:#24413f;
  --profond:#7fd3d6; --emeraude:#4cc39f; --turq:#36c6cc; --tint:#183236;
  --ok:#5fd08f; --ok-bg:#16352a; --ko:#f08a74; --ko-bg:#3a1f1a; --warn-bg:#3a3020;
  --on-accent:#0d1a1c; --img-bg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a1c; --surface:#132629; --fg:#e4eef0; --muted:#9db0b4; --line:#24413f;
  --profond:#7fd3d6; --emeraude:#4cc39f; --turq:#36c6cc; --tint:#183236;
  --ok:#5fd08f; --ok-bg:#16352a; --ko:#f08a74; --ko-bg:#3a1f1a; --warn-bg:#3a3020;
  --on-accent:#0d1a1c; --img-bg:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.logo{background:#fff;border-radius:6px;padding:4px 6px;display:flex}
.logo img{height:34px;width:auto;display:block}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--emeraude);font-weight:700}
h1{font-size:24px;line-height:1.2;color:var(--profond);margin:4px 0 6px;text-wrap:balance}
h2{font-size:19px;line-height:1.25;color:var(--profond);margin:0 0 6px;text-wrap:balance}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
label.f{display:block;font-weight:700;color:var(--profond);margin-bottom:6px}
input[type=text],input[inputmode]{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
button{font:inherit;cursor:pointer;border:none}
.btn{background:var(--profond);color:var(--on-accent);font-weight:700;padding:14px 18px;border-radius:10px;width:100%;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:transparent;color:var(--profond);border:2px solid var(--line)}
.mission{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--fg)}
.mnum{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--profond);font-weight:700;display:grid;place-items:center;font-size:18px}
.mission.done .mnum{background:var(--emeraude);color:var(--on-accent)}
.mt{font-weight:700;color:var(--profond);line-height:1.25}
.mw{font-size:13px;color:var(--muted)}
.score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--emeraude);white-space:nowrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.barrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.back{background:none;color:var(--profond);font-weight:700;padding:6px 0}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--emeraude);transition:width .25s}
.qtype{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.q{font-size:18px;font-weight:700;line-height:1.35;margin:4px 0 12px}
.ctx{background:var(--tint);border-radius:10px;padding:12px;margin-bottom:12px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--profond)}
.opt.sel .k{background:var(--profond);border-color:var(--profond);color:var(--on-accent)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--ko);background:var(--ko-bg)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;font-weight:700}
.numrow{display:flex;gap:10px;align-items:center}
.numrow input{flex:1;min-width:0}
.unit{font-weight:700;color:var(--profond);font-size:18px}
.match{display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;flex-direction:column;gap:6px}
.mrow .l{font-weight:700}
select{font:inherit;width:100%;padding:11px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.mrow.good select{border-color:var(--ok);background:var(--ok-bg)}
.mrow.bad select{border-color:var(--ko);background:var(--ko-bg)}
.order .pool,.order .seq{display:flex;flex-direction:column;gap:8px}
.order .seq{min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:10px;margin-bottom:10px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:10px;background:var(--surface);border:2px solid var(--line);color:var(--fg);font-size:15px;width:100%}
.chip b{color:var(--profond)}
.chip .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--profond);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.chip.good{border-color:var(--ok);background:var(--ok-bg)}
.chip.bad{border-color:var(--ko);background:var(--ko-bg)}
.link{background:none;color:var(--profond);text-decoration:underline;padding:4px 0;font-size:14px}
.media{margin-bottom:12px}
.imgbox{background:var(--img-bg);border-radius:10px;border:1px solid var(--line);overflow:auto;-webkit-overflow-scrolling:touch}
.imgbox img{display:block;width:100%;max-width:none;height:auto}
.imgbox.zoom img,.imgbox.zoom svg{width:170%!important}
.tblbox{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{padding:8px 8px;white-space:nowrap;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--profond);color:var(--on-accent);font-weight:700}
td:first-child{font-weight:700;color:var(--profond);text-align:left}
.cap{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 6px}
.imgbox svg{max-width:none}
.fb{border-radius:10px;padding:14px;margin-top:14px;font-size:15px}
.fb.good{background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--ko-bg);border-left:5px solid var(--ko)}
.fb .v{font-weight:700;font-size:17px;margin-bottom:4px}
.fb.good .v{color:var(--ok)} .fb.bad .v{color:var(--ko)}
.hint{background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.big{font-size:44px;font-weight:700;color:var(--profond);font-variant-numeric:tabular-nums;line-height:1}
.rec{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--tint);color:var(--profond)}
.review{display:flex;flex-direction:column;gap:6px;font-size:14px}
.review div{display:flex;gap:8px}
.review .m{flex:none;font-weight:700}
.review .m.g{color:var(--ok)} .review .m.b{color:var(--ko)}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}
</style>
<style>
.wrap{max-width:860px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);text-decoration:none}
.step .n{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--profond);display:grid;place-items:center;font-weight:700}
.step.done .n{background:var(--emeraude);color:var(--on-accent)}
.step.lock{opacity:.55}
.step .t{font-weight:700;color:var(--profond);line-height:1.25}
.step .w{font-size:13px;color:var(--muted)}
.stat{font-weight:700;color:var(--emeraude);white-space:nowrap;font-size:14px}
.chap{background:#fff;color:#1e2426;border:1px solid var(--line);border-radius:12px;padding:16px}
.chap img{max-width:100%;height:auto}
.chap th,.chap td{white-space:normal;text-align:left;font-variant-numeric:normal}
.chap td:first-child{font-weight:400;color:inherit}
.chap table{font-size:13px}
.chap th,.chap td{padding:6px 7px!important}
@media (prefers-color-scheme: dark){.chap{background:#fff;color:#1e2426}}
</style>
</head>

const CHAP = [{"titre": "Présentation", "html": "<p style=\"margin:0 0 12px;line-height:1.55\">Dans un logement, on parle de <strong>domotique</strong>. Dans un immeuble de bureaux, une école, un hôpital ou un magasin, les équipements techniques sont plus nombreux, plus puissants et confiés à un exploitant : on parle de <strong>gestion technique du bâtiment (GTB)</strong>. Ce cours prolonge la domotique résidentielle et le bus KNX vus en T12, ainsi que la mesure des consommations vue en T11.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Objectifs</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">À la fin de ce cours, vous serez capable de :</p>\n<ul style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\">distinguer domotique, GTC et GTB et citer les fonctions d'une GTB tertiaire ;</li><li style=\"margin-bottom:4px\">situer les obligations du dispositif éco-énergie tertiaire (« décret tertiaire ») et du décret BACS ;</li><li style=\"margin-bottom:4px\">décrire l'architecture d'une GTB en trois niveaux et le rôle d'une passerelle ;</li><li style=\"margin-bottom:4px\">reconnaître les protocoles courants (BACnet, KNX, Modbus, DALI, M-Bus) et leurs supports ;</li><li style=\"margin-bottom:4px\">câbler, adresser et grouper les luminaires d'une ligne d'éclairage DALI ;</li><li style=\"margin-bottom:4px\">participer à la mise en service d'une GTB : liste de points, essais, procès-verbal, cybersécurité.</li></ul>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Compétences du référentiel</h3>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Compétence</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Épreuve</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">C3 — Définir une installation à l'aide de solutions préétablies</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">E2</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">C6 — Régler, paramétrer les matériels de l'installation</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">E32</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">C10 — Exploiter les outils numériques dans le contexte professionnel</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">E2</td></tr></tbody></table></div>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Prérequis</h3>\n<ul style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\">Domotique résidentielle et bus KNX : adresses physiques et de groupe, alimentation de bus (T12).</li><li style=\"margin-bottom:4px\">Puissance, énergie, sous-comptage, transformateurs de courant (T11).</li><li style=\"margin-bottom:4px\">Capteurs TOR et analogiques, signaux 0-10 V et 4-20 mA (T04).</li></ul>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Comment travailler ce cours</h3>\n<ol style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\">Lisez chaque chapitre dans l'ordre, puis répondez au <strong>quiz du chapitre</strong> : il se corrige tout seul et vous pouvez le refaire.</li><li style=\"margin-bottom:4px\">Faites les <strong>exercices interactifs</strong> (4 missions) : la correction s'affiche après chaque réponse.</li><li style=\"margin-bottom:4px\">Rédigez les <strong>exercices d'application</strong> et déposez-les dans le devoir prévu.</li><li style=\"margin-bottom:4px\">Terminez par l'<strong>évaluation finale</strong>.</li></ol>"}, {"titre": "1. Domotique, GTC et GTB", "html": "<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Un bâtiment qui fonctionne à vide</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">Un plateau de bureaux éclairé un dimanche soir, une ventilation qui tourne pendant les vacances, un chauffage réglé à 23 °C dans une salle vide : dans le tertiaire, une grande partie de l'énergie est consommée quand personne n'en a besoin. La GTB sert d'abord à <strong>éviter ce gaspillage</strong>, puis à <strong>surveiller</strong> les installations et à <strong>alerter</strong> l'exploitant en cas de défaut.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Trois termes à ne pas confondre</h3>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Terme</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Ce que c'est</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Exemple</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Domotique</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Commande, programmation et supervision des équipements d'un <strong>logement</strong>.</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Volets, éclairage, chauffage d'une maison</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">GTC — gestion technique centralisée</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\"><strong>Surveiller et alarmer</strong>, souvent pour un seul lot technique. On regarde, on est prévenu, on agit peu.</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Report des défauts d'une chaufferie vers un poste de garde</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">GTB — gestion technique du bâtiment</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\"><strong>Superviser et piloter plusieurs lots</strong>, avec optimisation de l'énergie.</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Chauffage, ventilation, éclairage, stores et comptage d'un immeuble de bureaux</td></tr></tbody></table></div>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Les lots pilotés par une GTB</h3>\n<ul style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\"><strong>CVC</strong> : chauffage, ventilation, climatisation (chaudière, pompe à chaleur, centrale de traitement d'air CTA, ventilo-convecteurs).</li><li style=\"margin-bottom:4px\"><strong>Éclairage</strong> : intérieur et extérieur, par zone, avec détection et gradation.</li><li style=\"margin-bottom:4px\"><strong>Stores et occultations</strong> : protection solaire, confort visuel.</li><li style=\"margin-bottom:4px\"><strong>Comptage d'énergie</strong> : électricité, gaz, eau, chaleur, par usage et par zone.</li><li style=\"margin-bottom:4px\"><strong>Alarmes techniques</strong> : défaut de pompe, inondation, température de local serveur, coupure d'alimentation.</li></ul>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">D'où viennent les économies ?</h3>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Levier</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Exemple d'action de la GTB</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Ne rien faire fonctionner quand le bâtiment est vide</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Programmation horaire, mode vacances, extinction après détection d'absence</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Régler au juste besoin</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Consigne de température par zone, ventilation selon le CO₂, gradation selon la lumière du jour</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Détecter vite les dérives</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Alarme si une consommation dépasse sa valeur habituelle, si une vanne reste ouverte</td></tr></tbody></table></div>\n<div style=\"background:#E6F6F5;border-left:5px solid #0E8A6C;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#0E8A6C;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">QUI FAIT QUOI ?</div><p style=\"margin:0 0 6px;line-height:1.5\">Le <strong>bureau d'études</strong> définit la GTB et rédige la liste de points.</p><p style=\"margin:0 0 6px;line-height:1.5\">L'<strong>intégrateur GTB</strong> programme les automates et la supervision.</p><p style=\"margin:0 0 6px;line-height:1.5\">L'<strong>électricien</strong> câble les équipements et les bus, adresse les appareils de terrain, réalise des paramétrages simples et participe aux essais : c'est votre rôle en Bac Pro MELEC.</p><p style=\"margin:0 0 6px;line-height:1.5\">L'<strong>exploitant</strong> utilise la GTB au quotidien et reçoit les alarmes.</p></div>\n<div style=\"background:#E8F5EC;border-left:5px solid #1FA447;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#1FA447;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">À RETENIR</div><p style=\"margin:0 0 6px;line-height:1.5\">GTC = surveiller et alarmer ; GTB = superviser <strong>et piloter</strong> plusieurs lots en optimisant l'énergie.</p><p style=\"margin:0 0 6px;line-height:1.5\">Les économies viennent de trois leviers : arrêter quand c'est vide, régler au juste besoin, détecter les dérives.</p></div>"}, {"titre": "2. La réglementation", "html": "<p style=\"margin:0 0 12px;line-height:1.55\">Deux textes poussent les bâtiments tertiaires à s'équiper. Ils sont <strong>distincts</strong> : un bâtiment peut être concerné par l'un, par l'autre ou par les deux.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Le dispositif éco-énergie tertiaire (« décret tertiaire »)</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\"><strong>Qui est concerné ?</strong> Les bâtiments ou parties de bâtiments à usage tertiaire dont la surface est <strong>au moins égale à 1 000 m²</strong> : bureaux, commerces, enseignement, santé, hôtellerie… Propriétaires et occupants partagent l'obligation.</p>\n<p style=\"margin:0 0 12px;line-height:1.55\"><strong>Quel objectif ?</strong> Réduire la consommation d'énergie finale par rapport à une <strong>année de référence</strong> choisie à partir de 2010 :</p>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Échéance</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Réduction à atteindre</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Si la référence est 1 000 MWh</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">2030</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">− 40 %</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">600 MWh au plus</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">2040</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">− 50 %</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">500 MWh au plus</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">2050</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">− 60 %</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">400 MWh au plus</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">Une autre possibilité existe : atteindre une <strong>valeur absolue</strong> de consommation fixée pour chaque type d'activité.</p>\n<p style=\"text-align:center;font-family:monospace;font-size:1.05em;font-weight:bold;color:#0B5560;background:#E6F6F5;padding:8px;border-radius:6px;margin:0 0 12px\">Consommation maximale = consommation de référence × (1 − réduction)</p>\n<p style=\"margin:0 0 12px;line-height:1.55\">Exemple : référence 600 MWh, objectif 2030 : 600 × (1 − 0,40) = 600 × 0,6 = <strong>360 MWh</strong>.</p>\n<p style=\"margin:0 0 12px;line-height:1.55\"><strong>Comment le suivre ?</strong> Les consommations sont déclarées chaque année sur la plateforme <strong>OPERAT</strong> (ADEME), au plus tard le <strong>30 septembre</strong> pour l'année précédente. D'où l'intérêt du comptage par usage vu en T11.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Le décret BACS : la GTB devient obligatoire</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">BACS signifie <em>Building Automation and Control Systems</em> : systèmes d'automatisation et de contrôle des bâtiments. Les décrets n° 2020-887 et n° 2023-259 (articles R. 175-1 et suivants du code de la construction et de l'habitation) imposent un tel système dans les bâtiments tertiaires dont le chauffage ou la climatisation dépasse une puissance nominale donnée.</p>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Bâtiment tertiaire</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Puissance nominale de chauffage ou de climatisation</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Obligation</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Existant</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">plus de 290 kW</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">depuis le 1er janvier 2025</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Existant</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">de 70 à 290 kW</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">au 1er janvier 2030 (échéance reportée, initialement 2027)</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Neuf, permis déposé depuis le 22 juillet 2021</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">plus de 290 kW</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">dès la livraison</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Neuf, permis déposé depuis le 9 avril 2024</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">plus de 70 kW</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">dès la livraison</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">La puissance prise en compte est celle du système de chauffage ou de climatisation, combiné ou non à la ventilation.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Ce que doit faire un système BACS</h3>\n<ol style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\"><strong>Mesurer</strong> : suivre, enregistrer et analyser les consommations par zone fonctionnelle, au pas horaire.</li><li style=\"margin-bottom:4px\"><strong>Conserver</strong> : garder les données à l'échelle mensuelle pendant 5 ans.</li><li style=\"margin-bottom:4px\"><strong>Comparer</strong> : situer le bâtiment par rapport à des valeurs de référence.</li><li style=\"margin-bottom:4px\"><strong>Alerter</strong> : détecter les pertes d'efficacité et en informer l'exploitant.</li><li style=\"margin-bottom:4px\"><strong>Communiquer</strong> : être interopérable avec les autres systèmes, permettre l'arrêt manuel et la gestion autonome.</li></ol>\n<p style=\"margin:0 0 12px;line-height:1.55\">Le système est <strong>inspecté</strong> périodiquement : au plus tous les 5 ans, et dans les 2 ans qui suivent son installation ou son remplacement. Une exemption est possible si le temps de retour sur investissement dépasse 10 ans ; elle doit être justifiée par une étude conservée pour l'inspection.</p>\n<div style=\"background:#E9F0F9;border-left:5px solid #4A87C6;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#4A87C6;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">REPÈRE RÉGLEMENTAIRE</div><p style=\"margin:0 0 6px;line-height:1.5\">Les échéances du décret BACS ont déjà été modifiées : l'enseignant les vérifie sur Légifrance ou sur le site du ministère (guide BACS) avant chaque utilisation de ce cours.</p></div>\n<div style=\"background:#FFF4E0;border-left:5px solid #E8A33D;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#E8A33D;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">POINT DE VIGILANCE</div><p style=\"margin:0 0 6px;line-height:1.5\">Le BACS n'est pas un simple afficheur : il doit détecter les dérives et permettre d'agir.</p><p style=\"margin:0 0 6px;line-height:1.5\">Décret tertiaire (surface ≥ 1 000 m²) et décret BACS (puissance &gt; 70 kW ou &gt; 290 kW) sont deux obligations différentes : vérifiez toujours les deux critères.</p></div>\n<div style=\"background:#E8F5EC;border-left:5px solid #1FA447;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#1FA447;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">À RETENIR</div><p style=\"margin:0 0 6px;line-height:1.5\">Décret tertiaire : ≥ 1 000 m² ; − 40 % en 2030, − 50 % en 2040, − 60 % en 2050 ; déclaration sur OPERAT avant le 30 septembre.</p><p style=\"margin:0 0 6px;line-height:1.5\">Décret BACS : existant &gt; 290 kW depuis 2025 ; existant 70 à 290 kW en 2030 ; neuf dès la livraison selon la date du permis.</p></div>"}, {"titre": "3. Architecture et protocoles", "html": "<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Une architecture en trois niveaux</h3>\n<figure style=\"margin:0 0 16px;text-align:center\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXgAAANZCAIAAAA6ScHJAAEAAElEQVR42uzdd1wU1/438LMdlt57la5gAQt2bKhg77EmGksSExO9GlNN1JumMSbRJDf2xBZrLGCjCIiCKAgiTXrvZReWhS3PH+eXeSa7C6Ixubn3ft5/5GWG2TlTz5nznVM4arWaAAAAAAAAAAA8D1ycAgAAAA adding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Supervision</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Visualiser, historiser, alarmer, programmer</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Poste GTB, serveur, accès web de l'exploitant</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Réseau IP (Ethernet)</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Automatisme</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Réguler, traduire les protocoles</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Automates CVC, passerelles KNX/IP ou DALI/IP, concentrateurs de comptage</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Réseau IP vers le haut, bus de terrain vers le bas</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Terrain</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Mesurer et agir</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Sondes, vannes, CTA, boutons-poussoirs, actionneurs, drivers LED, compteurs</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Bus de terrain ou câblage direct</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">Une information suit toujours le même chemin : un <strong>capteur</strong> mesure (niveau terrain), un <strong>automate</strong> décide (niveau automatisme), la <strong>supervision</strong> affiche et enregistre (niveau supervision). Une commande de l'exploitant fait le chemin inverse.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Les types de points</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">Chaque information échangée avec la GTB s'appelle un <strong>point</strong>. On distingue trois natures :</p>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Type</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Ce que c'est</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Exemples</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Signal sur le terrain</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">TOR (tout ou rien)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Deux états seulement</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Marche / arrêt d'une pompe, défaut, contact de fenêtre</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Contact sec, 24 V</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Analogique</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Une valeur qui varie en continu</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Température, humidité, CO₂, position de vanne</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">0-10 V ou 4-20 mA, ou valeur transmise par bus</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Compteur</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Une quantité qui s'accumule</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Énergie électrique (kWh), volume d'eau (m³)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Impulsions, Modbus, M-Bus</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">Chaque point a aussi un <strong>sens</strong> : une <strong>commande</strong> part de la GTB vers l'équipement ; un <strong>état</strong> ou une <strong>mesure</strong> remonte de l'équipement vers la GTB.</p>\n<div style=\"background:#E6F6F5;border-left:5px solid #0E8A6C;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#0E8A6C;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">POURQUOI 4-20 mA ?</div><p style=\"margin:0 0 6px;line-height:1.5\">Le zéro de la mesure correspond à 4 mA et non à 0 mA : si l'automate lit 0 mA, il sait que le fil est coupé et peut déclencher une alarme. Un signal 0-10 V ne permet pas cette détection.</p></div>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Les protocoles courants</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">Un <strong>protocole</strong> est la langue commune que des appareils utilisent pour échanger des informations. En tertiaire, plusieurs protocoles cohabitent, chacun sur le lot où il est le plus utilisé.</p>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Protocole</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Support</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Usage typique en tertiaire</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">BACnet (ISO 16484-5)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">IP, ou MS/TP sur RS-485</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Échanges entre automates CVC et supervision</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">KNX (EN 50090)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Paire torsadée, IP, radio</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Éclairage, stores, chauffage pièce par pièce</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Modbus</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">RTU sur RS-485, ou TCP sur Ethernet</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Compteurs, variateurs de vitesse, groupes froids</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">DALI (IEC 62386)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Bus 2 fils</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Éclairage : drivers LED, détecteurs, boutons</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">M-Bus (EN 13757)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Bus 2 fils</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Relève de compteurs d'eau et de chaleur</td></tr></tbody></table></div>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Câbler un bus RS-485 (Modbus RTU, BACnet MS/TP)</h3>\n<ul style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\">Câble à <strong>paire torsadée blindée</strong>, avec un conducteur de référence (0 V) en plus de la paire de données.</li><li style=\"margin-bottom:4px\">Topologie <strong>en bus</strong> : on passe d'un appareil à l'autre ; pas d'étoile, pas de longue dérivation.</li><li style=\"margin-bottom:4px\">Une <strong>résistance de fin de ligne</strong> (souvent 120 Ω) à chaque extrémité du bus, pas au milieu.</li><li style=\"margin-bottom:4px\">En Modbus, chaque appareil reçoit une <strong>adresse unique</strong> (1 à 247) et une même <strong>vitesse</strong> de communication que les autres.</li></ul>\n<div style=\"background:#FFF4E0;border-left:5px solid #E8A33D;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#E8A33D;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">POINT DE VIGILANCE</div><p style=\"margin:0 0 6px;line-height:1.5\">Deux appareils avec la même adresse, une vitesse différente ou une fin de ligne oubliée suffisent à rendre tout un bus muet : ce sont les premières choses à vérifier.</p></div>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">La passerelle</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">Une <strong>passerelle</strong> traduit les informations d'un protocole dans un autre : par exemple, elle présente les objets KNX d'un étage comme des objets BACnet pour la supervision. C'est souvent elle que l'on paramètre à la mise en service : chaque point de la liste doit y être déclaré.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Les classes de performance (NF EN ISO 52120-1)</h3>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Classe</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Niveau</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Exemple</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">A</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Haute performance énergétique</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Régulation selon l'occupation réelle, optimisation continue</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">B</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Régulation avancée</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Régulation communicante par pièce, supervision, suivi</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">C</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Régulation standard (référence)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Programmation horaire, régulation de base</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">D</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Non performant</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Régulation manuelle, pas d'automatisation</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">La norme NF EN ISO 52120-1 (2022) remplace l'EN 15232. La classe atteinte permet de comparer des solutions et de valoriser les économies, notamment pour les certificats d'économies d'énergie (CEE).</p>\n<div style=\"background:#E8F5EC;border-left:5px solid #1FA447;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#1FA447;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">À RETENIR</div><p style=\"margin:0 0 6px;line-height:1.5\">Trois niveaux : supervision, automatisme, terrain.</p><p style=\"margin:0 0 6px;line-height:1.5\">Trois types de points : TOR, analogique, compteur ; deux sens : commande, état ou mesure.</p><p style=\"margin:0 0 6px;line-height:1.5\">BACnet pour le CVC, KNX pour les pièces, Modbus pour compteurs et variateurs, DALI pour l'éclairage, M-Bus pour les compteurs d'eau et de chaleur ; la passerelle traduit.</p></div>"}, {"titre": "4. L'éclairage DALI", "html": "<p style=\"margin:0 0 12px;line-height:1.55\">L'éclairage représente une part importante de la consommation d'un bâtiment de bureaux. <strong>DALI</strong> (<em>Digital Addressable Lighting Interface</em>, norme IEC 62386) permet de commander chaque luminaire individuellement : allumer, éteindre, faire varier, connaître son état et signaler une panne.</p>\n<figure style=\"margin:0 0 16px;text-align:center\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXgAAAOkCAYAAAAcJ1xZAAEAAElEQVR42uydd1RUx/v/37uUXXrvKgio2EUQFLBhwa7YO9aYaJqaaIwlRo1JNJYYTVETe2/YRUUpgg1sFGmKUgSU3pYFdp/fHzn3/lh2l6Lkk/Kd1zmco7t37t6ZO+WZ9zzzjICICAwGg8FgMBgMBoPBYDAYDAaDwfi3UShkZcBgMBgMBoPBYDAYDAaDwWAwGP9OmMDLYDAYDAaDwWAwGAwGg8FgMBhgAi+DwWAwGAwGg8FgMBgMBoPBYDDABF4Gg8FgMBgMBoPBYDAYDAaDwWCACbwMBoPBYDAYDAaDwWAwGAwGgwEm8DIYDAaDwWAwGAwGg8FgMBgMBgNM4GUwGP85ZDIZKwQGg8FgMOqBiFBVVfV/dtzk8l9dXc0qA+NfZedWVlaygmAwGAwG/k8KvEQEuVwOImKlzWD8h1m5ciX69++PTZs2NahfkMlkrF/4P1RGTZEfNp7875HL5ZDL5awg/sIy+r9Wp1mdAi5dugQ/Pz/MnDkTBQUF/9ix4q96V+Hh4Rg8eDAmTpyI7OxsNlay9vmPp7q6GgsXLoSvry/27NnD6huDwWAw8K8WeKVSKTIyMpCRkQGpVNrgHzh27Bh8fX2xcOHC/1ODYUFBAdLT0/ky4/5ycnJQXFz8zkZGRkYG0tPTUVRU1CDj9/Xr10hLS2vURIKIkJWVhbS0tHd+ZsZ/m7Nnz2LdunUICwvDl19+icjIyDqv37JlC/r164f169ezwlPDzp074evri1WrVv0n8rNnzx74+vriyy+/fOt7BAYGwtfXFx9++CHzFv8fkJ6ejqFDh8LPzw/JycmsQFTw8uVLDB06FIMGDXqrMoqNjUW/fv0watQo5Obm/ufLKz4+Hr6+vhg5cuT/ifyq4vnz53j//fdx7do1jBw5Eubm5u90v4ULF6Jfv344cuRIk9ftgQMHon///nj58mWT3Tc7OxvvvfcegoKCMHjwYNjZ2eFdF5f79euH3377jXVI70h+fj7GjBkDX19fPHz4UGnukZmZiaysrP+TAvC2bduwdetWSCQSjBo1CgKBgFUYBoPBYPzj0Gzohff "padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Groupes</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">16 (0 à 15) ; un driver peut appartenir à plusieurs groupes</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Scènes</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">16 par appareil</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Tension du bus</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">12 à 22,5 V, typiquement 16 V</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Courant de l'alimentation de bus</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">250 mA au plus</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Longueur</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">jusqu'à 300 m en 1,5 mm² (chute de tension ≤ 2 V)</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Débit</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">1 200 bit/s</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">Valeurs typiques de la norme : la notice du contrôleur et des drivers fait foi.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Câblage</h3>\n<ul style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\">Chaque driver reçoit le <strong>230 V</strong> (L, N, PE) par le circuit d'éclairage protégé, et les <strong>deux fils DA</strong> du bus.</li><li style=\"margin-bottom:4px\">Les deux fils DALI ne sont généralement <strong>pas polarisés</strong> sur les drivers : l'inversion des fils DA ne les empêche pas de fonctionner (vérifier la notice).</li><li style=\"margin-bottom:4px\">Le bus DALI n'est pas une très basse tension de sécurité : selon la notice, ses deux fils peuvent cheminer <strong>dans le même câble</strong> que l'alimentation des luminaires (par exemple un câble 5 conducteurs).</li><li style=\"margin-bottom:4px\">Topologie libre (bus, étoile, arbre), mais <strong>pas de boucle</strong>, et longueur totale limitée.</li><li style=\"margin-bottom:4px\">Une <strong>alimentation de bus</strong> est nécessaire : elle est souvent intégrée au contrôleur.</li></ul>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Adresser, grouper, créer des scènes</h3>\n<ol style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\"><strong>Adressage</strong> : le contrôleur attribue une adresse courte à chaque driver, souvent automatiquement.</li><li style=\"margin-bottom:4px\"><strong>Identification</strong> : on fait clignoter chaque luminaire pour savoir où il se trouve, puis on le nomme (« Bureau 104 — fenêtre »).</li><li style=\"margin-bottom:4px\"><strong>Groupes</strong> : on regroupe les luminaires commandés ensemble (une rangée, une salle).</li><li style=\"margin-bottom:4px\"><strong>Scènes</strong> : on mémorise des niveaux d'éclairement (« réunion », « projection », « ménage »).</li></ol>\n<p style=\"margin:0 0 12px;line-height:1.55\">Une commande peut viser <strong>une adresse</strong> (un luminaire), <strong>un groupe</strong> ou <strong>tous les appareils</strong> à la fois (diffusion générale).</p>\n<div style=\"background:#E6F6F5;border-left:5px solid #0E8A6C;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#0E8A6C;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">DALI-2</div><p style=\"margin:0 0 6px;line-height:1.5\">La version DALI-2 normalise aussi les <strong>périphériques d'entrée</strong> : boutons-poussoirs, détecteurs de présence et de luminosité. Des produits de marques différentes fonctionnent ensemble s'ils sont certifiés.</p></div>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Combien de lignes ?</h3>\n<p style=\"text-align:center;font-family:monospace;font-size:1.05em;font-weight:bold;color:#0B5560;background:#E6F6F5;padding:8px;border-radius:6px;margin:0 0 12px\">Nombre de lignes = nombre de drivers ÷ 64, arrondi à l&#x27;entier supérieur</p>\n<p style=\"margin:0 0 12px;line-height:1.55\">Exemple : 90 luminaires → 90 ÷ 64 ≈ 1,4 → <strong>2 lignes</strong> (par exemple 45 + 45), ou un contrôleur à deux sorties DALI. On garde une réserve pour les extensions.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Fonctions d'éclairage en tertiaire</h3>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Fonction</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Principe</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Intérêt</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Détection d'absence</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Allumage manuel par bouton, extinction automatique après un délai sans présence</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Économie maximale dans les bureaux</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Détection de présence</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Allumage et extinction automatiques</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Circulations, sanitaires</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Gradation selon la lumière du jour</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Un capteur mesure l'éclairement ; les luminaires proches des fenêtres baissent leur flux</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Éclairement constant au poste, moins d'énergie</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Horaires et scènes</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Plages d'ouverture, scènes mémorisées</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Adapter l'éclairage à l'usage de la salle</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">Ces fonctions comptent dans la classe de performance ISO 52120 du bâtiment.</p>\n<div style=\"background:#EAF7FA;border-left:5px solid #62C2D8;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#62C2D8;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">ACTIVITÉ SUR LE PLATEAU</div><p style=\"margin:0 0 6px;line-height:1.5\">Si votre établissement dispose d'un contrôleur DALI : adressez la ligne, identifiez chaque luminaire, créez deux groupes et une scène, puis faites constater le fonctionnement.</p></div>\n<div style=\"background:#E8F5EC;border-left:5px solid #1FA447;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#1FA447;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">À RETENIR</div><p style=\"margin:0 0 6px;line-height:1.5\">DALI : 64 adresses, 16 groupes, 16 scènes, bus ≈ 16 V, jusqu'à 300 m en 1,5 mm².</p><p style=\"margin:0 0 6px;line-height:1.5\">Plus de 64 drivers : une ligne supplémentaire.</p><p style=\"margin:0 0 6px;line-height:1.5\">Un driver neuf n'a ni adresse ni groupe : il faut l'adresser et le réintégrer.</p></div>"}, {"titre": "5. Mise en service et exploitation", "html": "<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">La liste de points : le document clé</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">La <strong>liste de points</strong> recense toutes les informations échangées avec la GTB. Elle est fournie dans le dossier du projet. Pendant les essais, on la coche ligne par ligne.</p>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Équipement</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Point</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Type</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Sens</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Adresse / objet</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Alarme</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">CTA R+1</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Marche / arrêt</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">TOR</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Commande</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">BACnet BO-1</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">—</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">CTA R+1</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Défaut ventilateur</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">TOR</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">État</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">BACnet BI-3</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Oui</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">CTA R+1</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Température de soufflage</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Analogique</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Mesure</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">BACnet AI-2</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">&lt; 14 °C ou &gt; 35 °C</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Bureau 104</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Température ambiante</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Analogique</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Mesure</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">KNX 3/1/4</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">&lt; 16 °C</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Plateau R+2</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Éclairage rangée fenêtre</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">TOR</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Commande</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">DALI groupe 1</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">—</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">TGBT</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Énergie active</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Compteur</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Mesure</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Modbus 40023</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">—</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">Les seuils d'alarme de cet exemple sont donnés à titre d'illustration : ils sont fixés par le cahier des charges du projet.</p>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">La démarche de mise en service</h3>\n<ol style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\"><strong>Vérifier</strong> : câblage des bus (continuité, absence de court-circuit, polarité si exigée, fins de ligne), tensions des alimentations de bus, alimentation des automates et des passerelles.</li><li style=\"margin-bottom:4px\"><strong>Adresser</strong> : équipements de terrain et passerelles, selon le plan d'adressage du dossier.</li><li style=\"margin-bottom:4px\"><strong>Paramétrer</strong> (réglages simples et guidés) : plages horaires, consignes, seuils d'alarme.</li><li style=\"margin-bottom:4px\"><strong>Essayer</strong> chaque point de la liste, du terrain jusqu'à la supervision, dans les deux sens.</li><li style=\"margin-bottom:4px\"><strong>Consigner</strong> le résultat de chaque essai dans le procès-verbal, avec les réserves éventuelles.</li><li style=\"margin-bottom:4px\"><strong>Livrer</strong> : former l'exploitant et remettre le dossier (liste de points, plans, sauvegardes, comptes d'accès).</li></ol>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Essayer un point : exemple</h3>\n<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Point essayé</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Action sur le terrain</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Résultat attendu en supervision</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Défaut ventilateur CTA (TOR, état)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Simuler le défaut (ouvrir le contact de défaut)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Alarme affichée, horodatée, acquittable</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Température bureau 104 (analogique)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Comparer avec un thermomètre de contrôle</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Valeur cohérente à ± 0,5 °C près</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Marche / arrêt CTA (TOR, commande)</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Commander depuis la supervision</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">La CTA démarre, son état « marche » remonte</td></tr></tbody></table></div>\n<div style=\"background:#FBE9E7;border-left:5px solid #C0392B;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#C0392B;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">SÉCURITÉ ÉLECTRIQUE</div><p style=\"margin:0 0 6px;line-height:1.5\">Les essais se font dans le respect de la NF C 18-510 : habilitation adaptée, consignation avant toute intervention sur les circuits 230 V (séparer, condamner, vérifier l'absence de tension).</p><p style=\"margin:0 0 6px;line-height:1.5\">Prévenir l'exploitant avant de commander un équipement à distance : une CTA ou une pompe peut démarrer.</p></div>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">Cybersécurité</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">Une GTB est reliée au réseau informatique. Mal protégée, elle peut permettre à un tiers d'arrêter le chauffage, de couper l'éclairage ou de rentrer dans le réseau de l'entreprise.</p>\n<ul style=\"margin:0 0 12px;padding-left:24px;line-height:1.55\"><li style=\"margin-bottom:4px\"><strong>Réseau GTB séparé</strong> du réseau bureautique (réseau virtuel, VLAN).</li><li style=\"margin-bottom:4px\"><strong>Mots de passe par défaut changés</strong> sur chaque automate, passerelle et poste.</li><li style=\"margin-bottom:4px\"><strong>Comptes nominatifs</strong> : un compte par personne, avec les droits strictement nécessaires.</li><li style=\"margin-bottom:4px\"><strong>Mises à jour</strong> des logiciels et micrologiciels.</li><li style=\"margin-bottom:4px\"><strong>Accès à distance</strong> uniquement par une solution sécurisée (VPN), jamais par un port ouvert sur la box internet.</li><li style=\"margin-bottom:4px\"><strong>Sauvegarde</strong> des programmes et paramétrages, remise avec le dossier.</li></ul>\n<h3 style=\"color:#0B5560;font-size:1.15em;margin:22px 0 8px;border-bottom:2px solid #CFE6E6;padding-bottom:4px\">L'exploitation au quotidien</h3>\n<p style=\"margin:0 0 12px;line-height:1.55\">Après la livraison, l'exploitant suit les consommations, traite les alarmes et ajuste les horaires. Le système BACS est inspecté au plus tous les 5 ans. Toute modification (nouveau luminaire, driver remplacé, nouvelle sonde) doit être reportée dans la liste de points et la sauvegarde mise à jour.</p>\n<div style=\"background:#E8F5EC;border-left:5px solid #1FA447;border-radius:6px;padding:10px 14px;margin:0 0 14px\"><div style=\"color:#1FA447;font-weight:bold;font-size:0.85em;letter-spacing:.04em;margin-bottom:4px\">À RETENIR</div><p style=\"margin:0 0 6px;line-height:1.5\">Mise en service = liste de points essayée point par point, du terrain à la supervision, tracée au procès-verbal.</p><p style=\"margin:0 0 6px;line-height:1.5\">L'électricien vérifie, adresse, paramètre simplement et essaie ; l'intégrateur programme.</p><p style=\"margin:0 0 6px;line-height:1.5\">Cybersécurité : réseau séparé, mots de passe changés, comptes nominatifs, mises à jour, accès distant sécurisé.</p></div>"}, {"titre": "Synthèse", "html": "<div style=\"overflow-x:auto;margin:0 0 14px\"><table style=\"border-collapse:collapse;width:100%;font-size:0.95em\"><thead><tr><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">Thème</th><th style=\"background:#0B5560;color:#fff;text-align:left;padding:7px 9px;border:1px solid #0B5560\">L'essentiel</th></tr></thead><tbody><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Vocabulaire</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Domotique = logement ; GTC = surveiller et alarmer ; GTB = superviser et piloter plusieurs lots.</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Décret tertiaire</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">≥ 1 000 m² ; − 40 % (2030), − 50 % (2040), − 60 % (2050) ; OPERAT avant le 30 septembre.</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Décret BACS</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Existant &gt; 290 kW depuis 2025 ; 70 à 290 kW en 2030 ; neuf dès la livraison ; données mensuelles conservées 5 ans.</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Architecture</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">Supervision, automatisme, terrain ; points TOR, analogiques, compteurs ; passerelles.</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Protocoles</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">BACnet (CVC), KNX (pièces), Modbus (compteurs, variateurs), DALI (éclairage), M-Bus (compteurs d'eau et de chaleur).</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">DALI</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;background:#E6F6F5\">64 adresses, 16 groupes, 16 scènes, ≈ 16 V, jusqu'à 300 m en 1,5 mm².</td></tr><tr><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Mise en service</td><td style=\"padding:7px 9px;border:1px solid #CFE6E6;vertical-align:top;\">Vérifier, adresser, paramétrer, essayer point par point, consigner, livrer ; sécuriser le réseau.</td></tr></tbody></table></div>\n<p style=\"margin:0 0 12px;line-height:1.55\">Pour aller plus loin : la séance T14 aborde l'alarme anti-intrusion, qui peut être reliée à la GTB (report d'états) et à la domotique (scénario « départ »).</p>"}];
const QUIZ = [{"titre": "Quiz — Chapitre 1", "questions": [{"q": "La GTC (gestion technique centralisée) sert principalement à :", "o": ["surveiller et alarmer, souvent un seul lot", "piloter et optimiser tous les lots", "commander les équipements d'un logement", "déclarer les consommations"], "k": 0, "fb": "GTC : surveiller et alarmer ; la GTB pilote et optimise plusieurs lots."}, {"q": "Que signifie CVC ?", "o": ["Chauffage, ventilation, climatisation", "Contrôle, vérification, commande", "Courant, variation, compteur", "Centrale de ventilation centralisée"], "k": 0, "fb": "Chauffage, ventilation, climatisation."}, {"q": "Lequel n'est PAS un lot habituellement piloté par une GTB ?", "o": ["La charpente", "L'éclairage", "Les stores", "Le comptage d'énergie"], "k": 0, "fb": "Lots : CVC, éclairage, stores, comptage, alarmes techniques."}, {"q": "Quel levier d'économie correspond à « ventilation selon le taux de CO₂ » ?", "o": ["Régler au juste besoin", "Arrêter quand le bâtiment est vide", "Détecter les dérives", "Augmenter la puissance souscrite"], "k": 0, "fb": "On adapte le débit au besoin réel."}, {"q": "Qui programme les automates et la supervision d'une GTB ?", "o": ["L'intégrateur GTB", "L'électricien Bac Pro", "L'exploitant", "Le gestionnaire du réseau de distribution"], "k": 0, "fb": "L'électricien câble, adresse, paramètre simplement et participe aux essais."}, {"q": "Une alarme « inondation local technique » fait partie :", "o": ["des alarmes techniques", "du comptage d'énergie", "de l'éclairage", "des stores"], "k": 0, "fb": "Les alarmes techniques : défauts, inondation, température de local serveur…"}]}, {"titre": "Quiz — Chapitre 2", "questions": [{"q": "Objectif du décret tertiaire pour 2040 :", "o": ["− 50 %", "− 40 %", "− 60 %", "− 25 %"], "k": 0, "fb": "− 40 % en 2030, − 50 % en 2040, − 60 % en 2050."}, {"q": "Date limite de déclaration annuelle sur OPERAT :", "o": ["30 septembre", "31 décembre", "1er janvier", "30 juin"], "k": 0, "fb": "Au plus tar : "Le zéro de mesure est à 4 mA : 0 mA signale une coupure."}, {"q": "Protocole le plus utilisé entre automates CVC et supervision :", "o": ["BACnet", "DALI", "M-Bus", "Wiegand"], "k": 0, "fb": "BACnet (ISO 16484-5), sur IP ou MS/TP."}, {"q": "Support du Modbus RTU :", "o": ["RS-485", "fibre optique uniquement", "courant porteur sur le 230 V", "radio 868 MHz"], "k": 0, "fb": "Modbus RTU sur RS-485 ; Modbus TCP sur Ethernet."}, {"q": "Plage d'adresses d'un appareil Modbus :", "o": ["1 à 247", "0 à 63", "1 à 16", "0 à 15"], "k": 0, "fb": "Adresses uniques de 1 à 247."}, {"q": "Valeur courante d'une résistance de fin de ligne RS-485 :", "o": ["120 Ω", "10 kΩ", "1 Ω", "1 MΩ"], "k": 0, "fb": "Souvent 120 Ω, une à chaque extrémité."}, {"q": "Rôle d'une passerelle :", "o": ["traduire un protocole dans un autre", "alimenter le bus", "protéger contre les surintensités", "mesurer l'énergie"], "k": 0, "fb": "Elle traduit, par exemple KNX vers BACnet."}, {"q": "Classe ISO 52120 d'un système à haute performance énergétique :", "o": ["A", "B", "C", "D"], "k": 0, "fb": "A haute performance, D non performant."}]}, {"titre": "Quiz — Chapitre 4", "questions": [{"q": "DALI signifie :", "o": ["Digital Addressable Lighting Interface", "Direct Analog Light Input", "Distribution Automatique des Lumières Intérieures", "Driver Alimenté en Liaison Isolée"], "k": 0, "fb": "Interface numérique d'éclairage adressable (IEC 62386)."}, {"q": "Nombre de scènes par appareil DALI :", "o": ["16", "64", "8", "256"], "k": 0, "fb": "16 scènes par appareil."}, {"q": "Tension typique du bus DALI :", "o": ["16 V", "230 V", "29 V", "5 V"], "k": 0, "fb": "12 à 22,5 V, typiquement 16 V. 29 V, c'est le KNX."}, {"q": "Débit du bus DALI :", "o": ["1 200 bit/s", "9 600 bit/s", "100 Mbit/s", "1 bit/s"], "k": 0, "fb": "1 200 bit/s (le KNX TP est à 9 600 bit/s)."}, {"q": "90 luminaires DALI nécessitent au minimum :", "o": ["2 lignes", "1 ligne", "3 lignes", "6 lignes"], "k": 0, "fb": "90 > 64 : 2 lignes."}, {"q": "La
