box pour l'accès distant", "désactiver les mises à jour"], "k": 0, "fb": "Mots de passe changés, comptes nominatifs, mises à jour, VPN."}, {"q": "VLAN signifie ici :", "o": ["un réseau virtuel séparant la GTB de la bureautique", "un variateur de lumière", "une vanne de régulation", "un logiciel de supervision"], "k": 0, "fb": "Réseau virtuel : la GTB est séparée du réseau bureautique."}, {"q": "À la livraison, on remet à l'exploitant :", "o": ["liste de points, plans, sauvegardes, comptes d'accès", "uniquement la clé du TGBT", "les emballages", "rien, tout est dans le cloud"], "k": 0, "fb": "Avec une formation à l'utilisation."}]}];
const KEY = "melec-t13-cours-v1", QKEY = KEY + "-envoi", EXOKEY = "melec-t13-exos-v1";
const LIBRE = /[?&]libre=1/.test(location.search);
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st = {prenom: "", vu: {}, quiz: {}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = Object.assign(st, s); } catch(e){}
if (!st.prenom) try { const e = JSON.parse(localStorage.getItem(EXOKEY)); if (e && e.prenom) st.prenom = e.prenom; } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
function exos(){ try { const e = JSON.parse(localStorage.getItem(EXOKEY)); return e && e.res ? Object.keys(e.res).length : 0; } catch(e){ return 0; } }
const reussi = i => st.quiz[i] && st.quiz[i].best / st.quiz[i].n >= 0.5;

/* parcours : [type, index, titre, condition] */
const STEPS = [["chap",0,"Présentation"]];
for (let i = 1; i <= 5; i++) { STEPS.push(["chap",i,CHAP[i].titre]); STEPS.push(["quiz",i,"Quiz — Chapitre " + i]); }
STEPS.push(["exos",0,"Exercices interactifs"],["devoir",0,"Exercices d'application (à rédiger)"],["chap",6,"Synthèse"],["eval",0,"Évaluation finale"]);
function ouvert(s){
  if (LIBRE) return [true, ""];
  const [t, i] = s;
  if (t === "chap" && i === 0) return [true, ""];
  if (t === "chap" && i === 1) return [!!st.vu[0], "Lisez d'abord la présentation."];
  if (t === "chap" && i <= 5) return [reussi(i-1), "Réussissez d'abord le quiz du chapitre " + (i-1) + " (50 % minimum)."];
  if (t === "quiz") return [!!st.vu[i], "Lisez d'abord le chapitre " + i + "."];
  if (t === "exos" || t === "devoir" || (t === "chap" && i === 6)) return [reussi(5), "Réussissez d'abord le quiz du chapitre 5."];
  if (t === "eval") { const ok = [1,2,3,4,5].every(reussi) && exos() >= 4; return [ok, "Réussissez les 5 quiz et terminez les 4 missions d'exercices."]; }
  return [true, ""];
}
function fait(s){ const [t, i] = s; if (t === "chap") return !!st.vu[i]; if (t === "quiz") return reussi(i); if (t === "exos") return exos() >= 4; return false; }
function statut(s){ const [t, i] = s; if (t === "quiz" && st.quiz[i]) return st.quiz[i].best + " / " + st.quiz[i].n; if (t === "exos") return exos() + " / 4 missions"; return fait(s) ? "✓" : ""; }

function header(){ return `<header class="top"><div class="logo"><img src="${LOGO}" alt="${CFG.alt}"></div>
  <div><div class="eyebrow">Bac Pro MELEC · Technologie</div><div class="muted" style="font-size:13px">Séance T13 · ${CFG.mode}</div></div></header>`; }

function accueil(){
  app.innerHTML = header() + `<h1>Domotique et GTB tertiaire</h1>
  <p class="muted">Suivez le parcours dans l'ordre : chaque étape s'ouvre quand la précédente est faite. Votre progression reste enregistrée sur cet appareil.</p>
  <div class="panel" style="margin-block:12px"><label class="f" for="prenom">Prénom et initiale du nom</label>
  <input type="text" id="prenom" maxlength="30" value="${esc(st.prenom)}" placeholder="ex. Rui"></div>
  ${LIBRE ? '<p class="hint">Mode libre : toutes les étapes sont ouvertes.</p>' : ""}
  <div class="stack" id="list"></div>
  <footer>${CFG.foot}</footer>`;
  const list = document.getElementById("list");
  STEPS.forEach((s, k) => {
    const [ok, why] = ouvert(s), d = fait(s);
    const el = document.createElement(s[0] === "exos" || s[0] === "eval" || s[0] === "devoir" ? "a" : "button");
    el.className = "step" + (d ? " done" : "") + (ok ? "" : " lock");
    el.innerHTML = `<span class="n">${d ? "✓" : (ok ? k + 1 : "🔒")}</span><span><span class="t">${esc(s[2])}</span><br><span class="w">${ok ? typeLabel(s[0]) : esc(why)}</span></span><span class="stat">${statut(s)}</span>`;
    if (ok) {
      if (s[0] === "exos") el.href = "t13.html";
      else if (s[0] === "eval") el.href = "eval_t13.html" + (LIBRE ? "?libre=1" : "");
      else if (s[0] === "devoir") { el.href = "exercices_application_t13.pdf"; el.target = "_blank"; }
      else el.onclick = () => { if (!nom()) return; s[0] === "chap" ? lire(s[1]) : quizDebut(s[1]); };
      if (el.tagName === "A") el.addEventListener("click", ev => { if (!nom()) ev.preventDefault(); });
    } else if (el.tagName === "A") el.removeAttribute("href");
    list.appendChild(el);
  });
  const inp = document.getElementById("prenom");
  inp.oninput = () => { st.prenom = inp.value.trim(); save(); inp.style.borderColor = ""; };
  window.scrollTo(0, 0);
}
function typeLabel(t){ return {chap:"Cours", quiz:"Quiz corrigé automatiquement, 50 % pour réussir", exos:"4 missions, correction après chaque réponse", devoir:"Énoncé à imprimer, à rendre au " + CFG.pro, eval:"15 questions, une seule tentative"}[t]; }
function nom(){ if (st.prenom) return true; const i = document.getElementById("prenom"); if (i) { i.style.borderColor = "var(--ko)"; i.focus(); } return false; }

function lire(i){
  st.vu[i] = true; save();
  const next = i === 0 ? "Chapitre 1" : i <= 5 ? "Quiz — Chapitre " + i : "Évaluation finale";
  app.innerHTML = `<div class="bar"><div class="barrow"><button class="back" id="back">‹ Parcours</button><span>${esc(CHAP[i].titre)}</span></div></div>
  <div class="chap">${CHAP[i].html}</div>
  <div class="actions">${i >= 1 && i <= 5 ? `<button class="btn" id="go">Faire le ${next}</button>` : ""}<button class="btn sec" id="back2">Retour au parcours</button></div>`;
  document.getElementById("back").onclick = accueil; document.getElementById("back2").onclick = accueil;
  const g = document.getElementById("go"); if (g) g.onclick = () => quizDebut(i);
  window.scrollTo(0, 0);
}

let cur = null;
function melange(n){ const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function quizDebut(i){ const Q = QUIZ[i-1].questions; cur = {i, k: 0, rep: [], ordre: melange(Q.length), opts: Q.map(q => melange(q.o.length))}; question(); }
function question(){
  const Q = QUIZ[cur.i-1].questions, n = Q.length, qi = cur.ordre[cur.k], q = Q[qi];
  app.innerHTML = `<div class="bar"><div class="barrow"><button class="back" id="back">‹ Parcours</button><span>${QUIZ[cur.i-1].titre} · ${cur.k+1} / ${n}</span></div>
  <div class="track"><div class="fill" style="width:${cur.k/n*100}%"></div></div></div>
  <div class="panel"><div class="q">${esc(q.q)}</div><div class="opts">${cur.opts[qi].map((oi, j) => `<button class="opt" data-o="${oi}"><span class="k">${"ABCD"[j]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
  <div id="fb"></div><div class="actions"><button class="btn" id="go" disabled>Valider</button></div></div>`;
  document.getElementById("back").onclick = accueil;
  let pick = null, done = false;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (done) return; app.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); pick = +b.dataset.o; document.getElementById("go").disabled = false; });
  const go = document.getElementById("go");
  go.onclick = () => {
    if (!done) {
      done = true; const ok = pick === q.k; cur.rep[qi] = ok;
      app.querySelectorAll(".opt").forEach(b => { const o = +b.dataset.o; if (o === q.k) b.classList.add("good"); else if (o === pick) b.classList.add("bad"); });
      document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><div class="v">${ok ? "Bonne réponse" : "Pas tout à fait"}</div>${esc(q.fb)}</div>`;
      go.textContent = cur.k + 1 < n ? "Question suivante" : "Voir mon résultat";
    } else { cur.k++; if (cur.k < n) { question(); window.scrollTo(0,0); } else fin(); }
  };
}
function fin(){
  const Q = QUIZ[cur.i-1].questions, n = Q.length, s = cur.rep.filter(Boolean).length, i = cur.i;
  const p = st.quiz[i] || {best: 0, n, essais: 0}; p.essais++; p.best = Math.max(p.best, s); p.n = n; st.quiz[i] = p; save();
  envoyer("T13-Q" + i, QUIZ[i-1].titre + " " + Q.map((q, k) => "Q" + (k+1) + (cur.rep[k] ? "✓" : "✗")).join(" "), s, n, p.essais);
  const ok = s / n >= 0.5;
  app.innerHTML = header() + `<div class="eyebrow">${QUIZ[i-1].titre}</div><h1>${esc(st.prenom)}</h1>
  <div class="panel stack"><span class="big">${s} / ${n}</span>
  <p class="muted" style="margin:0">${ok ? "Quiz réussi : l'étape suivante est ouverte." : "Il faut au moins " + Math.ceil(n/2) + " bonnes réponses : relisez le chapitre et recommencez."} Meilleur score : ${p.best} / ${n}.</p>
  <p id="envoi" class="muted" style="margin:0;font-size:.85em"></p></div>
  <div class="actions">${ok ? '<button class="btn" id="suite">Continuer le parcours</button>' : `<button class="btn" id="relire">Relire le chapitre ${i}</button>`}<button class="btn sec" id="refaire">Refaire le quiz</button></div>`;
  const a = document.getElementById("suite"); if (a) a.onclick = accueil;
  const r = document.getElementById("relire"); if (r) r.onclick = () => lire(i);
  document.getElementById("refaire").onclick = () => quizDebut(i);
  window.scrollTo(0, 0);
}
function fileEnvoi(){ try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch(e){ return []; } }
function majEnvoi(t){ const el = document.getElementById("envoi"); if (el) el.textContent = t; }
function envoyer(seance, titre, s, n, essai){
  if (ADRESSE_TABLEAU.indexOf("http") !== 0) return;
  const q = fileEnvoi(); q.push({id: Date.now() + "-" + seance, cle: CFG.cle, seance, prenom: st.prenom, mission: "", titre, score: s, sur: n, essai});
  try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e){}
  setTimeout(viderFile, 0);
}
function viderFile(){
  const q = fileEnvoi(); if (!q.length || ADRESSE_TABLEAU.indexOf("http") !== 0) return; const d = q[0];
  majEnvoi("Envoi du résultat…");
  fetch(ADRESSE_TABLEAU, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(d)})
  .then(() => { const r = fileEnvoi().filter(x => x.id !== d.id); try { localStorage.setItem(QKEY, JSON.stringify(r)); } catch(e){} majEnvoi("✓ Résultat transmis au " + CFG.pro + "."); if (r.length) viderFile(); })
  .catch(() => majEnvoi("Résultat non transmis (pas de réseau) : il sera renvoyé à la prochaine ouverture de la page."));
}
accueil(); window.addEventListener("load", viderFile);
</script>
